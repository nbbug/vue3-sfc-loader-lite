<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'">
  <title>vue3-sfc-loader-lite - runtime script setup</title>
</head>
<body>
  <div id="app"></div>
  <script src="/vue/vue.global.prod.js"></script>
  <script src="/dist/vue3-sfc-loader-lite.js"></script>
  <script>
    window.__done = false
    window.__error = null
    window.addEventListener('error', (event) => {
      window.__error = String((event.error && (event.error.stack || event.error.message)) || event.message)
      window.__done = true
    })
    window.addEventListener('unhandledrejection', (event) => {
      window.__error = String((event.reason && (event.reason.stack || event.reason.message)) || event.reason)
      window.__done = true
    })

    ;(async () => {
      try {
        const options = {
          moduleCache: { vue: Vue },
          async getFile(url) {
            const response = await fetch(url)
            if (!response.ok) throw new Error(response.status + ' ' + url)
            return await response.text()
          },
          addStyle(textContent) {
            const style = Object.assign(document.createElement('style'), { textContent })
            document.head.appendChild(style)
          },
        }

        const component = await window['vue3-sfc-loader-lite'].loadModule(
          '/fixtures/runtime-setup.vue',
          options,
        )
        Vue.createApp({
          render: () => Vue.h(component, { label: 'runtime-setup' }),
        }).mount('#app')

        await new Promise((resolve) => setTimeout(resolve, 50))

        const result = {
          text: document.querySelector('#app').textContent.trim(),
          color: getComputedStyle(document.querySelector('.pc')).color,
          scopeId: component.__scopeId,
          cacheKeys: Object.keys(options.moduleCache).sort(),
        }

        document.querySelector('#pc-inc').click()
        await new Promise((resolve) => setTimeout(resolve, 50))
        result.afterClick = document.querySelector('.pc-doubled').textContent

        window.__result = result
      } catch (error) {
        window.__error = String((error && (error.stack || error.message)) || error)
      } finally {
        window.__done = true
      }
    })()
  </script>
</body>
</html>
